name: TpSeamlessWallet
description: Deploy TpSeamlessWallet to ECS-Cluster.
runtime: dotnet

config:
 aws:region: ap-southeast-1
 TpSeamlessWallet:ServiceName: TpSeamlessWallet
 TpSeamlessWallet:ImagePath: integratedservice/thirdpartyseamlesswallet
 TpSeamlessWallet:Volumes:
    - ContainerPath: /seamlesswallet
      VolumePath: /logs/seamlesswallet