  BonusService:ContainerPort: "50997"
  BonusService:Cpu: "128"
  BonusService:DesiredCount: "0"
  BonusService:ENV: DEV
  BonusService:MaxCapacity: "3" #大於DesiredCount會建立AutoScaling
  BonusService:Memory: "128"
  BonusService:NamePrefix: AI1
