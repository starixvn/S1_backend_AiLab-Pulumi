name: StoreHangfire
description: Deploy StoreHangfire to ECS-Cluster.
runtime: dotnet

config:
 aws:region: ap-southeast-1
 StoreHangfire:ServiceName: StoreHangfire
 StoreHangfire:ImagePath: storeservice/storehangfireservice
 StoreHangfire:Volumes:
    - ContainerPath: /storeworker
      VolumePath: /logs/storeworker
