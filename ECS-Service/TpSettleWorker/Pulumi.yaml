name: TpSettleWorker
description: Deploy TpSettleWorker to ECS-Cluster.
runtime: dotnet

config:
 aws:region: ap-southeast-1
 TpSettleWorker:ServiceName: TpSettleWorker
 TpSettleWorker:ImagePath: integratedservice/thirdpartysettleworker
 TpSettleWorker:Volumes:
    - ContainerPath: /settleworker
      VolumePath: /logs/settleworker