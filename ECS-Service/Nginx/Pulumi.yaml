name: Nginx
description: Deploy Nginx to ECS-Cluster.
runtime: dotnet

config:
 aws:region: ap-southeast-1
 Nginx:ServiceName: Nginx
 Nginx:ImagePath: infra/nginx
 Nginx:HealthCheckPath: /
 Nginx:Volumes:
    - ContainerPath: /etc/nginx/log
      VolumePath: /logs/nginx
    - ContainerPath: /var
      VolumePath: /var