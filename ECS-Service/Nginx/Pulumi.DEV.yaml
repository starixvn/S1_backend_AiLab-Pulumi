config:
  Nginx:NamePrefix: AI1
  Nginx:ENV: DEV
  Nginx:Version: 1.18.0
  Nginx:ClusterStack: DEV #透過Pulumi Service取回ECS-Cluster的Output
  Nginx:TargetGroupStack: Nginx-DEV #透過Pulumi Service取回EC2-TargetGroup的Output
  Nginx:ContainerPort: 80
  Nginx:Cpu: 256
  Nginx:Memory: 256
  Nginx:DesiredCount: 1
  Nginx:MaxCapacity: 3  #大於DesiredCount會建立AutoScaling